<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Proposal</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d1d5db;
            --error: #b91c1c;
            --error-border: #ef4444;
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
            padding: 28px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 1.4rem;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fff;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.35);
        }

        .invalid {
            border-color: var(--error-border) !important;
            background: #fff5f5;
        }

        .help {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .actions {
            margin-top: 18px;
        }

        button {
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 11px 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .error-message {
            margin-top: 12px;
            color: var(--error);
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .meta {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            background: #eff6ff;
            font-size: 0.92rem;
        }

        .meta p {
            margin: 4px 0;
        }

        .notice {
            margin: 10px 0 12px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        ol {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>Submit Proposal</h1>

    <form id="proposal-form" novalidate>
        <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required placeholder="Short proposal title" />
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" required placeholder="Explain the problem and your proposed solution"></textarea>
        </div>

        <div class="field">
            <label for="region_level">Region level</label>
            <input id="region_level" name="region_level" type="text" required placeholder="district, city, province..." />
        </div>

        <div class="field">
            <label for="region_name">Region name</label>
            <input id="region_name" name="region_name" type="text" required placeholder="e.g. Khulna City" />
        </div>

        <div class="field">
            <label for="budget_estimate">Budget estimate</label>
            <input id="budget_estimate" name="budget_estimate" type="number" min="1" step="1" required placeholder="Positive integer" />
            <div class="help">Only positive integers are allowed.</div>
        </div>

        <div class="field">
            <label for="beneficiaries_estimate">Beneficiaries estimate</label>
            <textarea id="beneficiaries_estimate" name="beneficiaries_estimate" required placeholder="Who benefits and approximately how many people?"></textarea>
        </div>

        <div class="field">
            <label for="category">Category</label>
            <input id="category" name="category" type="text" required placeholder="e.g. education, health, infrastructure" />
        </div>

        <div class="field">
            <label for="proposal_file">Proposal file (optional)</label>
            <input id="proposal_file" name="proposal_file" type="file" />
        </div>

        <div class="actions">
            <button id="submit-btn" type="submit">Submit Proposal</button>
        </div>

        <div id="error-message" class="error-message hidden" role="alert"></div>
    </form>

    <section id="questions-panel" class="hidden" aria-live="polite">
        <div id="proposal-meta" class="meta"></div>
        <p class="notice">These questions will be answered by reviewers, not by you.</p>
        <ol id="questions-list"></ol>
        <div class="actions">
            <button id="done-btn" type="button">Done</button>
        </div>
    </section>
</main>

<script>
    (function () {
        const form = document.getElementById('proposal-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');
        const questionsPanel = document.getElementById('questions-panel');
        const proposalMeta = document.getElementById('proposal-meta');
        const questionsList = document.getElementById('questions-list');
        const doneBtn = document.getElementById('done-btn');

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return '';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Submitting…' : 'Submit Proposal';
        }

        function clearError() {
            errorMessage.textContent = '';
            errorMessage.classList.add('hidden');
        }

        function showError(message) {
            errorMessage.textContent = message || 'Something went wrong. Please try again.';
            errorMessage.classList.remove('hidden');
        }

        function validateRequiredFields() {
            const requiredElements = form.querySelectorAll('[required]');
            let valid = true;

            requiredElements.forEach((element) => {
                element.classList.remove('invalid');

                const value = (element.value || '').trim();
                if (!value) {
                    element.classList.add('invalid');
                    valid = false;
                    return;
                }

                if (element.name === 'budget_estimate') {
                    const budget = Number(value);
                    if (!Number.isInteger(budget) || budget <= 0) {
                        element.classList.add('invalid');
                        valid = false;
                    }
                }
            });

            return valid;
        }

        function renderQuestionsPanel(data) {
            const questions = Array.isArray(data.questions_criteria) ? data.questions_criteria : [];

            proposalMeta.innerHTML = '';
            const metaRows = [
                ['Title', data.title || ''],
                ['Level', data.proposal_level || ''],
                ['Score', data.proposal_score || ''],
                ['Status', data.proposal_status || ''],
                ['Proposed at', data.proposed_at || '']
            ];
            metaRows.forEach(([label, value]) => {
                const p = document.createElement('p');
                p.innerHTML = `<strong>${label}:</strong> ${value}`;
                proposalMeta.appendChild(p);
            });

            questionsList.innerHTML = '';
            questions.forEach((question) => {
                const li = document.createElement('li');
                li.textContent = question;
                questionsList.appendChild(li);
            });

            form.classList.add('hidden');
            questionsPanel.classList.remove('hidden');

            doneBtn.onclick = function () {
                if (data.id) {
                    window.location.href = `/proposals/${data.id}/`;
                } else {
                    alert('Proposal submitted successfully.');
                }
            };
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            clearError();

            if (!validateRequiredFields()) {
                showError('Please complete all required fields correctly.');
                return;
            }

            const formData = new FormData(form);
            const csrfToken = getCookie('csrftoken');

            setLoading(true);

            try {
                const response = await fetch('/proposals/submit/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    credentials: 'same-origin'
                });

                let payload = {};
                try {
                    payload = await response.json();
                } catch (_) {
                    payload = {};
                }

                if (response.status === 201) {
                    renderQuestionsPanel(payload);
                    return;
                }

                if (response.status === 400 || response.status === 503) {
                    const message = payload.detail || payload.message || 'Unable to submit proposal.';
                    showError(message);
                    return;
                }

                showError('Unexpected server response. Please try again.');
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading(false);
            }
        });
    })();
</script>
</body>
</html>
